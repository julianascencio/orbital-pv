[project]
name = "space-pv-cli"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "space-pv-analytics",
  "space-pv-connectors",
]

[project.scripts]
space-pv = "space_pv_cli.main:main"

[tool.uv.sources]
space-pv-analytics = { workspace = true }
space-pv-connectors = { workspace = true }

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
