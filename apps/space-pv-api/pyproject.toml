[project]
name = "space-pv-api"
version = "0.1.0"
description = "FastAPI boundary for the Space PV web application and automation clients"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "space-pv-orchestration",
  "space-pv-storage",
]

[project.scripts]
space-pv-api = "space_pv_api.main:run"

[tool.uv.sources]
space-pv-orchestration = { workspace = true }
space-pv-storage = { workspace = true }

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
