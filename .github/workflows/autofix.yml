name: autofix-python-quality

on:
  push:
    branches:
      - feat/initial-orbitalpv-platform

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/initial-orbitalpv-platform
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev --group lab
      - run: uv run ruff format .
      - run: uv run ruff check --fix .
      - name: Commit formatting fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply Ruff formatting and safe fixes"
          git push origin HEAD:feat/initial-orbitalpv-platform
