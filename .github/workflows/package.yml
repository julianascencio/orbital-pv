name: package

on:
  pull_request:
  push:
    branches: [main]

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Test installed wheel
        run: |
          python -m venv /tmp/orbitalpv-wheel
          /tmp/orbitalpv-wheel/bin/python -m pip install --upgrade pip
          /tmp/orbitalpv-wheel/bin/python -m pip install dist/*.whl matplotlib openpyxl
          /tmp/orbitalpv-wheel/bin/python -c "import orbitalpv as opv; print(opv.__version__)"
          MPLBACKEND=Agg /tmp/orbitalpv-wheel/bin/python examples/plot_pv_incidence.py
          MPLBACKEND=Agg /tmp/orbitalpv-wheel/bin/python examples/plot_case0_health.py
          MPLBACKEND=Agg /tmp/orbitalpv-wheel/bin/python examples/plot_orbit_eclipse.py
          MPLBACKEND=Agg /tmp/orbitalpv-wheel/bin/python examples/orbit_visualization/plot_orbit_families_3d.py
          MPLBACKEND=Agg /tmp/orbitalpv-wheel/bin/python examples/orbit_visualization/plot_molniya_orbit_3d.py
          MPLBACKEND=Agg /tmp/orbitalpv-wheel/bin/python examples/orbit_visualization/plot_ground_track.py
          MPLBACKEND=Agg /tmp/orbitalpv-wheel/bin/python examples/constellations/plot_starlink_gen1_solar_generation.py
          MPLBACKEND=Agg /tmp/orbitalpv-wheel/bin/python examples/space_cells/plot_space_cell_iv_comparison.py
          MPLBACKEND=Agg /tmp/orbitalpv-wheel/bin/python examples/space_cells/plot_space_cell_temperature_radiation.py
          MPLBACKEND=Agg /tmp/orbitalpv-wheel/bin/python examples/real_data/plot_birds_raavana_real_data.py
          /tmp/orbitalpv-wheel/bin/python labs/00_birds_baseline/run.py
          /tmp/orbitalpv-wheel/bin/python labs/02_pvlib_reference/run.py
