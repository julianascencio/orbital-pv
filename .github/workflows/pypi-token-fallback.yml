name: pypi-token-fallback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pypi-token-fallback.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Publish with an existing PyPI token if available
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          token="$PYPI_API_TOKEN"
          if [ -z "$token" ]; then token="$PYPI_TOKEN"; fi
          if [ -z "$token" ]; then token="$PYPI_PASSWORD"; fi
          if [ -z "$token" ]; then token="$TWINE_PASSWORD"; fi
          if [ -z "$token" ]; then
            echo "::error::No existing PyPI token secret is available in this repository or the pypi environment."
            exit 1
          fi
          python -m twine upload --username __token__ --password "$token" dist/*
