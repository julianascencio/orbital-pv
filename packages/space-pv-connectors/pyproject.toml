[project]
name = "space-pv-connectors"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "space-pv-core",
  "numpy>=2.3",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
ground = ["rasterio>=1.4,<2"]
netcdf = ["xarray>=2025.1", "h5netcdf>=1.5", "h5py>=3.12"]
ground-research = ["geopandas>=1.0,<2", "pyogrio>=0.9,<1", "eumdac>=3.0,<4"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.sources]
space-pv-core = { workspace = true }
