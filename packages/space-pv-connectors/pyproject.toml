[project]
name = "space-pv-connectors"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "space-pv-core",
  "numpy>=2.3",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
ground = ["rasterio>=1.4,<2"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.sources]
space-pv-core = { workspace = true }
