[project]
name = "space-pv-orchestration"
version = "0.1.0"
description = "Celery orchestration layer for Space PV Analytics jobs"
requires-python = ">=3.13"
dependencies = ["celery[redis]>=5.6,<6", "pydantic-settings>=2.7,<3", "space-pv-storage"]

[tool.uv.sources]
space-pv-storage = { workspace = true }

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
