[project]
name = "orbital-pv"
version = "0.3.0"
description = "OrbitalPV: research platform for spacecraft photovoltaic performance analytics"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "ruff>=0.13",
  "ty>=0.0.8",
]
lab = [
  "jupyterlab>=4.4",
  "matplotlib>=3.10",
  "numpy>=2.3",
  "openpyxl>=3.1",
  "pandas>=2.2",
]
pv = ["pvlib>=0.15.2,<0.16"]
orbit = ["astropy>=8.0,<9", "skyfield>=1.55,<2", "sgp4>=2.27,<3", "spiceypy>=8.2,<9"]
space = ["spacepy>=0.7"]
app = ["fastapi>=0.141,<1", "uvicorn[standard]>=0.34,<1", "celery[redis]>=5.6,<6", "duckdb>=1.5,<2", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/*/src", "apps/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.13"
root = ["packages/*/src", "apps/*/src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
